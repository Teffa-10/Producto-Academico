name: Build and Push Docker Image to GHCR

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - "**/*.js"
      - "**/*.json"
      - "**/*.html"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker image        
        run: docker build -t ghcr.io/${{ github.repository_owner,, }}/producto-academico:latest .

      - name: Push Docker image
        run: docker push ghcr.io/${{ github.repository_owner,, }}/producto-academico:latest
